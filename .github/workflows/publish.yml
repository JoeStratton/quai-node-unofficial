name: publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  TRIVY_DISABLE_VEX_NOTICE: "true"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    permissions:
      contents: read
      security-events: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/lint-and-security.yml

  build-and-push-image:
    needs: lint-and-security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read go-quai version
        id: goquai
        run: |
          version="$(awk '$1 == "require" && $2 == "github.com/dominant-strategies/go-quai" { print $3; exit }' go.mod)"
          short_sha="${GITHUB_SHA::7}"
          {
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "immutable=${version}-sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/quai-node-unofficial
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.goquai.outputs.version }}
            type=raw,value=${{ steps.goquai.outputs.immutable }}
            type=ref,event=branch,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build image for scan
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: quai-node-unofficial:scan
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (OS packages, blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quai-node-unofficial:scan
          scanners: vuln
          vuln-type: os
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy image scan (go binary libs, advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quai-node-unofficial:scan
          scanners: vuln
          vuln-type: library
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Dockle image lint
        uses: erzz/dockle-action@v1
        with:
          image: quai-node-unofficial:scan
          exit-code: 1
          failure-threshold: warn

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure go-quai version git tag exists
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.goquai.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null 2>&1; then
            echo "Tag ${version} already exists on origin."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${version}" -m "go-quai ${version}" "${GITHUB_SHA}"
          git push origin "${version}"

      - name: Check pushed tag release
        if: github.ref_type == 'tag'
        id: tag_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release for pushed git tag
        if: github.ref_type == 'tag' && steps.tag_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.goquai.outputs.version }}
          name: ${{ steps.goquai.outputs.version }}
          body: |
            go-quai upgraded to ${{ steps.goquai.outputs.version }}.

            ```bash
            docker pull ${{ vars.DOCKERHUB_USERNAME }}/quai-node-unofficial:${{ steps.goquai.outputs.version }}
            ```
