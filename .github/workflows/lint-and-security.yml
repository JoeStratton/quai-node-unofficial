name: lint-and-security

on:
  workflow_call:

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Gitleaks diffs commits and needs parent history on push events.
          fetch-depth: 0

      - name: Prepare git history for Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git rev-parse --is-shallow-repository | grep -q true; then
            git fetch --unshallow origin
          fi
          if ! git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            git fetch origin --deepen=1
          fi
          git rev-parse "${GITHUB_SHA}^" >/dev/null

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
