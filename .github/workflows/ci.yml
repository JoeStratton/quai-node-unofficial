name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    permissions:
      contents: read
      security-events: write
      actions: read
    secrets: inherit
    uses: ./.github/workflows/lint-and-security.yml

  build-and-scan-image:
    needs: lint-and-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: quai-node-unofficial:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quai-node-unofficial:ci
          scanners: vuln
          vuln-type: os,library
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy image scan (OS packages, blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quai-node-unofficial:ci
          scanners: vuln
          vuln-type: os
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Trivy image scan (go binary libs, advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quai-node-unofficial:ci
          scanners: vuln
          vuln-type: library
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Dockle image lint
        uses: erzz/dockle-action@v1
        with:
          image: quai-node-unofficial:ci
          exit-code: 1
          failure-threshold: warn
